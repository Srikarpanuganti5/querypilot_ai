name: QueryPilot CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON_DOWNLOADS: never
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
      QUERYPILOT_AGENT_LIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.5
          uv sync --locked --extra dev
      - name: Start isolated PostgreSQL 16 with random credentials
        run: .venv/bin/python scripts/ci_database.py
      - name: Migrate, seed and verify restricted reader
        run: .venv/bin/python -m querypilot.db.bootstrap
      - name: Full tests, coverage, mandatory DB cases and benchmark gate
        run: .venv/bin/python scripts/run_checks.py
      - name: Remove only CI-owned database container
        if: always()
        shell: bash
        run: |
          if [[ -n "${QP_CI_CONTAINER:-}" ]]; then
            docker rm -f "$QP_CI_CONTAINER"
          fi
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked log-verification dependencies
        run: |
          python -m pip install uv==0.13.5
          uv sync --locked --no-dev
      - name: Build images without publishing
        run: |
          docker build --file docker/Dockerfile.backend --target runtime --tag querypilot-backend:day12 .
          docker build --file docker/Dockerfile.frontend --tag querypilot-frontend:day12 .
      - name: Compose runtime, workflows, restart and persistence smoke
        run: |
          python3 scripts/prepare_docker.py
          docker compose --env-file .env.docker up --build --wait --wait-timeout 180
          docker compose --env-file .env.docker exec -T backend python -m querypilot.services.container_smoke
          mkdir -p .local
          docker volume inspect querypilot_day12_postgres_data --format '{{.CreatedAt}}' > .local/volume-before
          docker compose --env-file .env.docker stop db
          docker compose --env-file .env.docker exec -T backend python -m querypilot.services.container_smoke --unavailable
          docker compose --env-file .env.docker restart db backend frontend
          docker compose --env-file .env.docker up --wait --wait-timeout 180
          docker compose --env-file .env.docker exec -T backend python -m querypilot.services.container_smoke
          docker volume inspect querypilot_day12_postgres_data --format '{{.CreatedAt}}' > .local/volume-after
          cmp .local/volume-before .local/volume-after
          .venv/bin/python scripts/check_compose_logs.py
      - name: Clean shutdown; preserve volume
        if: always()
        run: docker compose --env-file .env.docker down --timeout 40
